name: CI — Monorepo Webs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lockfile, Isolation, Lint, Check, Build & Visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify client isolation and governance
        run: pnpm verify:isolation

      - name: Run Biome linter and formatting check
        run: pnpm lint

      - name: Run TypeScript and Astro diagnostics
        run: pnpm check

      - name: Build all workspaces, templates and client sites
        run: pnpm build

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Visual QA on changed sites (all routes)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          SITES="$(node scripts/changed-sites.mjs "$BASE_REF")"
          if [ -z "$SITES" ]; then
            SITES="_base"
          fi
          FAILED=""
          for SITE in $SITES; do
            echo "::group::Visual QA — $SITE"
            # Informativo: los dominios temporales (*.nexobite.com) son válidos hasta la entrega
            if [ -f "clientes/$SITE/cliente.json" ]; then
              pnpm cliente:check "$SITE"
            fi
            node scripts/qa-site.mjs "$SITE" || FAILED="$FAILED $SITE"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Visual QA falló en:$FAILED"
            exit 1
          fi

      - name: Upload Visual QA report and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-qa-artifacts
          path: |
            playwright-report/
            test-results/
            plantillas/*/docs/qa/
            clientes/*/docs/qa/
          retention-days: 7
