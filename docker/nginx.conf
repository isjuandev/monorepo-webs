server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify (Traefik/Caddy) termina TLS: evita redirecciones absolutas http://host:80
    absolute_redirect off;
    server_tokens off;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # Cabeceras de seguridad básicas (se repiten en los location que usan add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck para Docker/Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Caché inmutable para assets compilados de Astro (^~ evita que lo pise el regex de imágenes)
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Caché para imágenes y fuentes estáticas
    location ~* \.(?:ico|jpg|jpeg|gif|png|webp|avif|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # HTML sin caché larga para que cada despliegue se vea de inmediato
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
